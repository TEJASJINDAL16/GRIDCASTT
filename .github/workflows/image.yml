name: image
on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements.txt, 'src/**', 'scripts/**', 'tests/**', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gridcast:verify
      - name: Test before publishing
        run: docker run --rm gridcast:verify pytest -q tests/
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        run: printf '%s\n' "$IMAGE" > image-reference.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: image-reference.txt
