# gridcast configuration
# Every tunable lives here. No magic numbers in code.

project:
  name: gridcast
  timezone: Asia/Kolkata

# --- Demand data (Electricity Maps) ---
demand:
  provider: electricity_maps
  base_url: https://api.electricitymap.org/v3     # confirmed by probe
  range_path: /power-breakdown/past-range
  target_field: powerConsumptionTotal             # this is demand, in MW
  primary_zone: IN-NO          # Northern India — includes Delhi
  all_zones: [IN-NO, IN-WE, IN-SO, IN-EA, IN-NE]
  granularity: hourly
  # MEASURED 2026-09-08: all five zones serve data from 2017-01. The previous
  # 2021-01-01 was a guess, and it left only ~8 months of slack against the
  # 60-month split budget of 5c. This is also the ORIGIN OF `trend` (5e) -
  # days since this date - so moving it redefines that feature.
  backfill_start: "2017-01-01"
  # The past-range endpoint refuses more than 10 days of hourly data per call:
  #   {"error":"Date range exceeded 10 days limit for hourly data"}
  # fetch_range treats a 4xx as unrecoverable and returns no rows, so a chunk
  # above the limit yields an empty backfill that looks like a completed one.
  chunk_days: 9
  # Rows with isEstimated == true are TIME_SLICER_AVERAGE fill-ins, not
  # measurements. Cached so we can reason about revisions, never trained on.
  # The authoritative switch is quality.train_on_estimated (INV-3).

# --- Weather (Open-Meteo) ---
# One representative point per zone. Chosen as the dominant load centre,
# since aggregate demand is driven mostly by the largest population cluster.
weather:
  provider: open_meteo
  archive_url: https://archive-api.open-meteo.com/v1/archive
  forecast_url: https://api.open-meteo.com/v1/forecast
  variables:
    - temperature_2m
    - relative_humidity_2m
    - apparent_temperature
    - precipitation
    - cloud_cover
    - wind_speed_10m
    - shortwave_radiation
    - dew_point_2m
  points:
    IN-NO: {name: Delhi,     lat: 28.6139, lon: 77.2090}
    IN-WE: {name: Mumbai,    lat: 19.0760, lon: 72.8777}
    IN-SO: {name: Bengaluru, lat: 12.9716, lon: 77.5946}
    IN-EA: {name: Kolkata,   lat: 22.5726, lon: 88.3639}
    IN-NE: {name: Guwahati,  lat: 26.1445, lon: 91.7362}

# --- Feature engineering ---
# Thresholds are starting values. Find the real elbow from the data and
# replace them; do not leave a guess in place once it can be measured.
features:
  # MEASURED 2026-09-08 (was cooling_threshold_c: 24.0, a guess). RENAMED:
  # this is NOT an elbow above which cooling begins. Demand is monotone
  # increasing in temperature across the whole observed range; this is the
  # breakpoint at which an already-positive slope STEEPENS. The old name would
  # mislead every future reader. See 13 and reports/step0_measurements.md.
  temp_breakpoint_c: 21.5
  # heating_threshold_c DELETED. There is no U-shape and no pooled cold-side
  # rise, so there is no cold inflection to hold a threshold. See 13.
  rolling_temp_windows_h: [24, 72, 168]
  # Passed to BOTH stages. The Ridge stage sees only these.
  # temperature carries the slope below the breakpoint; cooling_degrees adds
  # the steeper slope above it. Together they reproduce the identified
  # `sloped_below` specification exactly.
  linear_stage_features: [temperature, cooling_degrees, trend]
  # cooling_degrees ONLY. LightGBM monotone constraints are per-feature and
  # GLOBAL, never zone-conditional, so constraining raw temperature would make
  # IN-NE's measured cold-side rise structurally unrepresentable. Because
  # cooling_degrees is zero below the breakpoint, constraining it constrains
  # the hot side and nothing else, leaving the cold side free.
  monotone_increasing: [cooling_degrees]
  # Range-checked for the `extrapolating` flag. NOT trend - trend is out of
  # range on every forecast by construction (5c/5f). temperature is here now
  # because it is a linear-stage feature and can leave the range either way.
  extrapolation_check: [temperature, cooling_degrees]
  # The linear stage extrapolates FREELY above the training range and is
  # CLAMPED at the training minimum below it (5f Principle 4). Asymmetric on
  # purpose: above the range there is a physical prior - hotter means more
  # cooling load - and it is the direction climate and AC penetration both
  # move. Below it there is no prior, no pooled heating load, and the error
  # would lean toward under-forecast, which is the dangerous direction.
  clamp_linear_below: true

# --- Data quality ---
quality:
  # INV-3. The bare isEstimated flag is NOT sufficient: the source uses three
  # estimation methods and they are not equivalent (see PLANNING 11).
  #   MEASURED                    sentinel for isEstimated == false
  #   MODE_BREAKDOWN              the fuel-mix breakdown is estimated; the
  #                               consumption total is not a fill-in
  #   GENERAL_PURPOSE_ZONE_MODEL  a modelled series, measured to be ~4x too
  #                               smooth at the evening peak - EXCLUDED
  #   TIME_SLICER_AVERAGE         the actual fill-in INV-3 exists for - EXCLUDED
  # Provisional pending the 2024-11-05 discontinuity test (13).
  trainable_estimation_methods: [MEASURED, MODE_BREAKDOWN]
  # Per-zone trainable start (relationship test, PLANNING 13). Rows before
  # these dates are excluded even when their estimation method is allowed,
  # because the temperature-to-demand SLOPE moves across the switch in these
  # two zones by more than the zone's own placebo band. The model pools rows;
  # it does not require equal spans.
  #   IN-NE  exceeds at 12, 15 and 18-month windows; gap stable at ~3.5 %/C
  #   IN-EA  exceeds at 15 and 18 only - a judgement call, cheapest to exclude
  #          because its earlier switch leaves 32 measured months
  trainable_from:
    IN-NE: "2024-11-05"
    IN-EA: "2024-01-01"
  train_on_estimated: false        # INV-3 - superseded by the allowlist above
  score_on_estimated: false        # INV-4
  # Suppressed demand (INV-8): flag hours where demand is flat or falling
  # while temperature rises. Values provisional until measured.
  suppression_temp_rise_c: 1.0
  suppression_demand_delta_pct: 0.0

# --- Daily archive (see 5d) ---
# Unrecoverable if delayed. Open-Meteo serves observed history and the CURRENT
# forecast, but never what the forecast said on a past date, so every day
# without archiving is a vintage that can never be reconstructed.
archive:
  # Store the WHOLE horizon the API returns, not only the 24 hours used. The
  # extra hours cost nothing on the same response and give a wider range of
  # lead times - and they are what makes a multi-day outage degrade gracefully
  # (5h) rather than fall off a cliff.
  forecast_days: 16                # Open-Meteo's maximum
  vintage_dir: data/raw/forecast_vintages
  revision_dir: data/raw/demand_revisions
  # How far back to re-fetch demand each day looking for revisions. Must
  # comfortably exceed the settlement lag we are trying to measure; the single
  # observed case took two days and splits.purge_gap_days assumes 10.
  revision_lookback_days: 21
  # Extend the observed-weather history as the archive API releases it (5d).
  observed_lag_days: 7

# --- Ingest validation (see 14) ---
# Plain assertions on every ingest: fail loudly and refuse to write. Both APIs
# can change shape silently, and a renamed column produces a plausible wrong
# forecast rather than an error.
#
# These bounds are deliberately LOOSE. They exist to catch a unit change, a
# renamed field or a decimal shift - not to filter data. A tight bound here
# would silently discard real extremes, which is the failure PLANNING 5f
# principle 2 is about.
validate:
  demand_mw_min: 0
  demand_mw_max: 200000            # IN-NO peaks in the tens of GW (5c)
  temperature_c_min: -40.0
  temperature_c_max: 60.0
  expected_freq_hours: 1           # both sources are hourly (11)
  # Gaps are reported, not fatal, on cached history - PLANNING 5h says log the
  # gap and exclude those rows. A gap in a window that should be contiguous IS
  # fatal; callers pass contiguous=True for that case.
  max_gap_fraction_warn: 0.05

# --- Splits ---
# All relative to available history. Never fixed dates, never random.
splits:
  tuning_window_months: 12         # earliest slice; search here only (INV-7)
  walk_forward_folds: 12
  fold_step: monthly
  min_initial_train_months: 24
  holdout_months: 12               # untouched until the project is finished
  # Deliberately conservative. NOT a measured settlement lag - that is
  # drift.settlement_lag_days and is still unmeasured. See 5c / 13.
  purge_gap_days: 10               # ASSUMPTION - measure via demand_revisions
  early_stopping_weeks: 8

# --- Training ---
train:
  target_transform: log            # train on log(demand), report MW
  correct_retransformation_bias: true
  recency_half_life_days: 365
  per_zone_sample_weighting: false # only if measurement shows a zone dominating
  seed: 42                         # pins LightGBM subsampling and Optuna
  retransformation: duan_smearing  # per zone, on the summed two-stage output
  ridge:
    alpha: null                    # DERIVED by tuning (step 10)
    standardize: true              # trend spans 0-2000, cooling_degrees 0-25
    fit_intercept: true
  lightgbm:                        # all DERIVED by tuning (step 10)
    num_leaves: null
    learning_rate: null
    min_data_in_leaf: null
    feature_fraction: null
    bagging_fraction: null
    lambda_l1: null
    lambda_l2: null
    # n_estimators is NOT tuned - early stopping selects it per fold

# --- Forecast error simulation (see 5d) ---
# Bridge only. Once ~6 months of archived vintages exist, train on the real
# forecasts instead and delete this.
forecast_noise:
  enabled: true
  day_bias_sigma_c: 1.2            # ASSUMPTION - measure from vintages
  hour_wobble_sigma_c: 0.5         # ASSUMPTION - measure from vintages

# --- Hyperparameter tuning ---
tuning:
  method: optuna
  n_trials: 100
  log_to_mlflow: true
  # Retraining does NOT retune. These are frozen between deliberate searches.

# --- Evaluation ---
evaluate:
  # Most recent MEASURED value for the same hour and weekday, at least
  # purge_gap_days before issue time. Not simply "last week".
  baseline: seasonal_naive
  peak_hours_ist: [18, 19, 20, 21, 22]   # reporting window; peak ERROR is
                                         # measured at the actual daily maximum
  # Selection procedure - see 5g
  selection_primary: mase
  selection_co_primary: rmsse       # must improve or hold; blocks trading
                                    # many small errors for a few large ones
  mase_variant: out_of_sample       # denominator = our baseline, same rows
  shortfall_threshold_pct: 3.0      # under-forecast by more than this = shortfall
  tail_percentile: 95
  ramp_window_hours_ist: [17, 18, 19, 20, 21]
  # Never report a single headline number.
  stratify_by: [temperature_band, hour_of_day, zone, day_type, lead_time, time_rolling]
  report_settled_fraction: true     # monitoring counterpart of row counts
  temperature_bands_c: [20, 30, 40, 45]
  report_row_counts: true
  # Band sufficiency (PLANNING 13). Not a flat floor: the top band is the
  # sparsest and is exactly the band that must stay separate.
  #   interior bands  >= min_band_rows
  #   top band        kept separate regardless of count
  #   any band < 200  reported as "insufficient rows to judge", not as a number
  min_band_rows: 500
  insufficient_band_rows: 200
  # Every veto is a tolerance, never a bare inequality. DERIVED at step 10a
  # from each metric's own fold-to-fold spread. See 5g / 13.
  veto_tolerance:
    top_band_pct: null
    signed_bias_pct: null
    shortfall_freq_pct: null
    p95_pct: null

# --- Drift triggers ---
# Thresholds are DERIVED from the phase 1 backtest error distribution, not
# chosen by hand, and are absolute once set - never recomputed from recent
# performance (see 5g Monitoring / section 6).
drift:
  thresholds_derived: false        # flip to true once the backtest has run
  rolling_window_days: 30
  monitor_alarm_days: 90           # no trigger this long -> check the monitor
  # --- settlement lag (see 5g) ---
  window_ends_at: settlement_frontier   # NOT today; window lags the present
  # --- trigger derivation (see 6) ---
  false_alarm_budget_per_year: 2        # THE tunable. thresholds fall out of it
  debounce_days: 3                      # consecutive breaches before firing
  per_zone_thresholds: true             # a pooled figure hides a small zone
  cooldown_after_promotion_days: 30     # one full window must flush through
  cooldown_after_rejection_days: 14
  post_promotion_watch_days: 7          # live during cooldown - see 6
  post_promotion_watch_escalates: true  # the cooldown's blind-spot cover
  watch_threshold: null                 # DERIVED - 7-day window sweep
  replay_model_mode: refreshed          # per-fold refit, never frozen
  injected_drift_pct: [2, 5, 10]        # tiebreak sweep - see 6
  structural_break_escalate: [3, 7]     # breach 3 of 7 days -> retrain trigger
  thresholds_backtest_sha: null         # mismatch disarms the monitor
  score_policy: frozen                  # monitoring/triggers freeze; backtest is live
  settlement_frontier_replay: false     # flip to true once demand_revisions has
                                        # enough history; until then thresholds
                                        # are provisionally optimistic (5g)
  frontier_scope: per_zone              # pooled figure uses the earliest of five
  cooldown_after_failure_days: 14       # a failed attempt cools down too (6)
  thresholds:                           # DERIVED at step 10a - see 6
    rolling_error:    {pooled: null, per_zone: {}}
    signed_bias:      {pooled: null, per_zone: {}}
    structural_break: {pooled: null, per_zone: {}}
  settlement_lag_days: null             # ASSUMPTION - measure via demand_revisions

# --- Failure policy (see 5h) ---
# Degrade with disclosure, skip when no honest output is possible, fail fast
# only when continuing would corrupt stored state.
failure:
  # ASSUMPTION - set this where a stale forecast stops beating the
  # no-weather baseline, measured from the vintage archive. See 13.
  max_forecast_vintage_age_hours: 72
  retry_interval_minutes: 15           # weather API outage: keep trying
  retry_window_hours: 4                # then keep the degraded forecast
  # No climatology fallback by design - the previous vintage is always better
  # and needs no extra mechanism. See 5h.
  min_zones_to_publish: 1
  max_gap_fraction: 0.05               # per fold; above this, mark unreliable
  max_consecutive_failures: 3          # then stop retrying and escalate
  fail_on_missing_config_key: true
  fail_on_placeholder: false           # run, but flag it in the output

# --- Dashboard (see 15) ---
dashboard:
  output_dir: docs                 # GitHub Pages serves this directory
  history_days: 10                 # forecasts shown; error only where settled
  zones: all                       # pre-rendered per zone, toggled client-side
  chart_format: svg
  show_baseline_line: true         # INV-5 - no error figure without its baseline
  show_row_counts: true
  draw_trigger_thresholds: true    # warning before firing, not after
  quantile_bands: false            # phase 1b
